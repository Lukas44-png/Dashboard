<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131c">
  <meta name="description" content="Product Bot – konfigurierbare Discord-Module, Panels und Moderation.">
  <title>Product Bot — Discord-Server einfach verwalten</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #11131c; color: #f5f5fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 0, #3e286c 0, transparent 54%), #11131c; }
    main { width: min(760px, 100%); text-align: center; }
    .eyebrow { color: #b7a3ff; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 18px 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.02; letter-spacing: -.055em; }
    p { max-width: 580px; margin: 0 auto; color: #b9bbca; font-size: clamp(1rem, 2.8vw, 1.2rem); line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; margin-top: 30px; padding: 0 24px; border: 1px solid transparent; border-radius: 14px; background: #8b78ff; color: white; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    [hidden] { display: none !important; }
    a.secondary { border-color: #49445f; background: #1b1b2a; }
    a:hover { background: #a092ff; transform: translateY(-2px); }
    a.secondary:hover { background: #29263a; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .note { margin-top: 20px; font-size: .85rem; }
  </style>
  <script>
    location.replace(new URL(`dashboard.html${location.search}${location.hash}`, location.href).href);
  </script>
</head>
<body>
  <main>
    <div class="eyebrow">Product Bot</div>
    <h1>Dein Discord.<br>Deine Regeln.</h1>
    <p>Konfiguriere Verifizierung, Tickets, Bewerbungen und Moderation zentral in deinem Dashboard.</p>
    <div class="actions"><a href="./dashboard.html">Dashboard öffnen</a></div>
  </main>
</body>
</html>
